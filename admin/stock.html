<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eldeva Stock</title>
<link rel="icon" href="../assets/brand/eldeva-wordmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <span class="wordmark" role="img" aria-label="Eldeva"></span>
    <h1>Shop admin</h1>
    <div class="form-err" id="loginErr" role="alert" hidden></div>
    <div class="field"><label for="lu">Username</label><input class="input" id="lu" name="username" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="lp">Password</label><input class="input" id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="dashboard.html" aria-label="Eldeva admin, overview"><span class="wordmark"></span></a>
      <nav class="tabs" aria-label="Admin sections">
        <a href="dashboard.html">Overview</a>
        <a href="orders.html">Orders</a>
        <a href="sell.html">Sell</a>
        <a href="events.html">Events</a>
        <a href="stock.html" aria-current="page">Stock</a>
        <a href="./">Products</a>
      </nav>
      <p class="who">Signed in as <b id="who"></b></p>
      <a class="link" href="../shop.html" target="_blank" rel="noopener">View the shop ↗</a>
      <button class="btn btn--ghost btn--sm" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main class="wrap">
    <div class="head"><div><h1>Stock</h1><p class="sum" id="sum">Loading…</p></div></div>
    <p class="help" style="margin:-12px 0 22px;max-width:62ch">Type how many you have of each item and what each one costs you to make. Sales on the Sell page take items off automatically. Changes save as you go.</p>
    <div class="seg" id="show" role="group" aria-label="Show">
      <button type="button" data-show="" aria-pressed="true">All</button>
      <button type="button" data-show="low">Running low</button>
      <button type="button" data-show="uncounted">Not counted yet</button>
      <button type="button" data-show="nocost">No cost yet</button>
    </div>
    <ol class="slist2" id="list"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ol>
  </main>
</div>

<dialog class="confirm" id="confirm" aria-labelledby="cfTitle">
  <h2 id="cfTitle"></h2>
  <p id="cfText"></p>
  <div class="acts"><button class="btn btn--ghost" type="button" value="no">Cancel</button><button class="btn" type="button" value="yes" id="cfYes">OK</button></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="common.js"></script>
<script src="pricing.js"></script>
<script src="stock.js"></script>
</body>
</html>
