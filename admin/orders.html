<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eldeva Orders</title>
<link rel="icon" href="../assets/brand/eldeva-wordmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <span class="wordmark" role="img" aria-label="Eldeva"></span>
    <h1>Shop admin</h1>
    <div class="form-err" id="loginErr" role="alert" hidden></div>
    <div class="field"><label for="lu">Username</label><input class="input" id="lu" name="username" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="lp">Password</label><input class="input" id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="dashboard.html" aria-label="Eldeva admin, overview"><span class="wordmark"></span></a>
      <nav class="tabs" aria-label="Admin sections">
        <a href="dashboard.html">Overview</a>
        <a href="orders.html" aria-current="page">Orders</a>
        <a href="sell.html">Sell</a>
        <a href="events.html">Events</a>
        <a href="stock.html">Stock</a>
        <a href="./">Products</a>
      </nav>
      <p class="who">Signed in as <b id="who"></b></p>
      <a class="link" href="../shop.html" target="_blank" rel="noopener">View the shop ↗</a>
      <button class="btn btn--ghost btn--sm" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main class="wrap">
    <div class="head">
      <div><h1>Orders</h1><p class="sum" id="sum">Loading your orders…</p></div>
      <span class="demo" title="These orders are made up so you can try the dashboard. Nothing is sent to Royal Mail or Stripe.">Sample orders</span>
    </div>
    <div class="tools">
      <div class="field"><label for="q">Search</label><input class="input" id="q" type="search" placeholder="Name, email, postcode or order number" autocomplete="off"></div>
      <div class="field"><label for="range">Paid</label><select class="input" id="range">
        <option value="7">In the last 7 days</option>
        <option value="30" selected>In the last 30 days</option>
        <option value="90">In the last 90 days</option>
        <option value="">Any time</option>
      </select></div>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Show orders that are">
      <button type="button" data-status="to-send">To send <span class="n"></span></button>
      <button type="button" data-status="sent">With Royal Mail <span class="n"></span></button>
      <button type="button" data-status="posted">Posted <span class="n"></span></button>
      <button type="button" data-status="">All <span class="n"></span></button>
    </div>
    <ol class="olist" id="list" aria-live="polite"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ol>
    <div class="more" id="more" hidden><button class="btn btn--ghost" type="button">Show more orders</button></div>
  </main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="oTitle">
  <div class="sheet-in">
    <div class="sheet-head">
      <div><h2 id="oTitle">Order</h2><p class="sub" id="oPaid"></p></div>
      <span id="oChip"></span>
      <button class="btn btn--ghost btn--sm x" type="button" data-close>Close</button>
    </div>
    <div class="sheet-body" id="oBody"></div>
    <div class="sheet-foot">
      <button class="btn btn--ghost" type="button" id="printBtn">Print packing slip</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="actBtn"></button>
    </div>
  </div>
</dialog>

<dialog class="confirm" id="confirm" aria-labelledby="cfTitle">
  <h2 id="cfTitle"></h2>
  <p id="cfText"></p>
  <div class="acts"><button class="btn btn--ghost" type="button" value="no">Not yet</button><button class="btn" type="button" value="yes" id="cfYes">OK</button></div>
</dialog>

<div class="slip" id="slip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="common.js"></script>
<script src="mock-data.js"></script>
<script src="orders.js"></script>
</body>
</html>
