<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eldeva Overview</title>
<link rel="icon" href="../assets/brand/eldeva-wordmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <span class="wordmark" role="img" aria-label="Eldeva"></span>
    <h1>Shop admin</h1>
    <div class="form-err" id="loginErr" role="alert" hidden></div>
    <div class="field"><label for="lu">Username</label><input class="input" id="lu" name="username" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="lp">Password</label><input class="input" id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="dashboard.html" aria-label="Eldeva admin, overview"><span class="wordmark"></span></a>
      <nav class="tabs" aria-label="Admin sections">
        <a href="dashboard.html" aria-current="page">Overview</a>
        <a href="orders.html">Orders</a>
        <a href="sell.html">Sell</a>
        <a href="events.html">Events</a>
        <a href="stock.html">Stock</a>
        <a href="./">Products</a>
      </nav>
      <p class="who">Signed in as <b id="who"></b></p>
      <a class="link" href="../shop.html" target="_blank" rel="noopener">View the shop ↗</a>
      <button class="btn btn--ghost btn--sm" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main class="wrap">
    <div class="head">
      <div><h1 id="hello">Hello</h1><p class="sum" id="today"></p></div>
      <span class="demo" title="These orders are made up so you can try the dashboard. Nothing is sent to Royal Mail or Stripe.">Sample orders</span>
    </div>

    <section aria-labelledby="qTitle">
      <div class="card queue" id="queue">
        <div class="qtop">
          <span class="big num" id="qCount" aria-hidden="true">–</span>
          <p><b id="qTitle">Orders to pack and post</b><span id="qNote">Loading…</span></p>
          <a class="btn" href="orders.html?status=to-send">Open orders to send</a>
        </div>
        <ol class="qlist" id="qList" aria-live="polite"></ol>
      </div>
    </section>

    <section class="sec" aria-labelledby="sTitle">
      <div class="sec-head"><h2 id="sTitle">Sales at a glance</h2><p class="note">Takings include delivery charges.</p></div>
      <div class="stats" id="stats">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>
      <div class="card chart">
        <div class="chart-head"><h3>Takings, last 30 days</h3><p id="cSum"></p></div>
        <div class="plot" id="plot"></div>
        <details class="as-table"><summary>Show as a table</summary><div id="cTable"></div></details>
      </div>
    </section>
  </main>
</div>

<dialog class="confirm" id="confirm" aria-labelledby="cfTitle">
  <h2 id="cfTitle"></h2>
  <p id="cfText"></p>
  <div class="acts"><button class="btn btn--ghost" type="button" value="no">Cancel</button><button class="btn" type="button" value="yes" id="cfYes">OK</button></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="common.js"></script>
<script src="mock-data.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
